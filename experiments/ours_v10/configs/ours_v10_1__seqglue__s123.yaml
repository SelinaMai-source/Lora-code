experiment_name: ours_v10_seqglue_v1
mode: ours
seed: 123
paths:
  project_root: .
  processed_stream_dir: data/processed
  processed_stream_file: seqglue_cl_tasks_train50_eval10.json
  assets_dir: assets
  results_dir: results
data:
  stream_format: citb_processed
  stream_name: seqglue
  auto_prepare_processed: false
  processed_stream_train_instances_per_task: 50
  processed_stream_eval_instances_per_task: 10
  processed_stream_limit_tasks: -1
  max_segments: -1
  max_train_examples_per_segment: -1
  max_eval_examples_per_segment: -1
  split: default
model:
  backbone_name: llama31-8b-instruct
  hf_model_name_or_path: assets/pretrained/meta-llama/Llama-3.1-8B-Instruct
  torch_dtype: bfloat16
  device: auto
  max_seq_len: 512
  gen_max_new_tokens: 64
  gen_do_sample: false
  gen_num_beams: 1
  mask_eos_token_in_labels: true
lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
  - q_proj
  - v_proj
train:
  epochs_per_segment: 1
  batch_size: 2
  lr: 0.0002
  weight_decay: 0.0
  grad_clip_norm: 1.0
  log_every: 25
  trajectory_early_stop: false
  hard_early_stop_enabled: false
  ours_v10_early_stop: true
  ours_v10_margin: 1.10
  ours_v10_forget_margin: 0.90
  ours_v10_check_segments:
  - 3
  - 4
  - 5
  ours_v10_baseline_csv: results/tables/published_seqglue_replay_lora_s123_segment_metrics.csv
spectral_replay:
  enabled: true
  buffer_size: 256
  replay_ratio: 0.30
  spectral_top_k: 8
  spectral_energy_threshold: 0.85
  min_replay_per_segment: 6
output:
  run_name: ours_v10_1_seqglue_s123
  save_every_segment: true
  write_tables: true
  write_logs: true
  tracking:
    use_wandb: true
    wandb_project: lora-ours-v10
    wandb_group: ours_v10_v1
    wandb_mode: online
    wandb_tags:
    - ours_v10
    - v1
    - seqglue
    - ssrg
    - seed_123
    wandb_notes: 'Ours v10.1: Seq-GLUE + Spectral Sparse Replay Gating vs Replay+10% SOTA'
    log_artifacts: true
paper:
  track: ours_v10
  category: ours_single_seed
  benchmark_alias: seqglue
  method_variant: ours_v10_1_ssrg
  memory_budget: 0
  family: ours
  published_setting_note: Ours v10.1 SSRG on Seq-GLUE train50/eval10
modules:
  use_drift_detector: true
  use_lora_bank: true
  use_router: true
  use_overlap_loss: true
bank:
  max_branches: 8
  spawn_on_drift: true
  freeze_old_branches: true
router:
  hard_routing: true
  soft_routing: false
  training_strategy: learned_router
  routing_backend: prototype
  prototype_update_steps: 2
  prototype_ema: 0.85
  margin_filter_min_gap: 0.02
drift:
  threshold: 0.03
  anchor_size: 32
overlap:
  beta: 0.04
  warmup_segments: 1
