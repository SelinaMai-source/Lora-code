  score_ema: 0.0
  shift_stat: absolute
  threshold: 0.025
experiment_name: paper_ours_instrdialog
lora:
  alpha: 32
  dropout: 0.05
  enabled: true
  r: 16
  target_modules:
  - q_proj
  - v_proj
mode: ours
model:
  backbone_name: llama31-8b-instruct
  device: auto
  gen_do_sample: false
  gen_max_new_tokens: 64
  gen_num_beams: 1
  hf_model_name_or_path: assets/pretrained/meta-llama/Llama-3.1-8B-Instruct
